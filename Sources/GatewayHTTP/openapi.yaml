openapi: "3.1.0"
info:
  title: Harbor API
  version: "1.0.0"
  description: |
    Register an account, verify its email address, sign in for an access token and a refresh token, and read
    your user.

    Every error is RFC 9457 problem details (`application/problem+json`). Besides the statuses each operation
    documents, any route may answer `413` (body too large), `429` (rate limited at the edge), `499` (client
    closed the request) and `501` (not implemented).
servers:
  - url: http://localhost:8080/v1
paths:
  /account:
    post:
      operationId: register
      summary: Register an account
      description: |
        Creates an account pending verification and emails a verification token. Retry with the same
        `Idempotency-Key` to get the same account back.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account, pending verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /account/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify the account's email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: The address is verified; the user is created shortly after.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /account/sign-in:
    post:
      operationId: signIn
      summary: Sign in for an access token and a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: The session's tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /account/refresh:
    post:
      operationId: refreshSession
      summary: Trade a refresh token for new tokens
      description: Each refresh token works once; presenting a used one ends its session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: The session's new tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /users/me:
    get:
      operationId: getUser
      summary: Read the caller's own user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A key the client makes once per create and repeats on every retry of it.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed or not valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The request's credentials are missing or not valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource already exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: The request failed unexpectedly.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A service the request needs is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: A service the request needs did not answer in time.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    UUID:
      type: string
      format: uuid
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: At least 8 characters and at most 72 bytes of UTF-8.
        displayName:
          type: string
          description: 1 to 100 characters.
    AccountStatus:
      type: string
      enum: [pendingVerification, active]
    AccountResponse:
      type: object
      required: [id, email, status, creationDate]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        email:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        creationDate:
          type: string
          format: date-time
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    RefreshSessionRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    SessionResponse:
      type: object
      required: [tokenType, accessToken, accessTokenExpirationDate, refreshToken]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        accessTokenExpirationDate:
          type: string
          format: date-time
        refreshToken:
          type: string
    UserResponse:
      type: object
      required: [id, displayName, creationDate]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        displayName:
          type: string
        creationDate:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
